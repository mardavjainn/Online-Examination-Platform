
# Server
server.port=8082
spring.application.name=exam-service

# Database
spring.datasource.url=jdbc:mysql://localhost:3306/exam_db
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# JWT Secret (MUST MATCH AUTH SERVICE)
jwt.secret=MyVerySecretKeyMyVerySecretKeyMyVerySecretKeyMyVerySecretKey

# JPA Auditing
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Logging
logging.level.com.example.exam_service=DEBUG
