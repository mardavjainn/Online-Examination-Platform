server.port=8083
spring.application.name=submission-service

# Database
spring.datasource.url=jdbc:mysql://localhost:3306/submission_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT Secret (MUST MATCH auth-service & exam-service)
jwt.secret=MyVerySecretKeyMyVerySecretKeyMyVerySecretKeyMyVerySecretKey

# Exam Service URL (to fetch questions)
exam.service.url=http://localhost:8082

# Result Service URL (to send for grading)
result.service.url=http://localhost:8084

# Logging
logging.level.com.example.submission_service=DEBUG
